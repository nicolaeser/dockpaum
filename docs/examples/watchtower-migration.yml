# yaml-language-server: $schema=https://raw.githubusercontent.com/nicolaeser/dockpaum/main/dockpaum.schema.json

dry_run: true

schedule:
  interval: 24h

update:
  cleanup_images: true
  policies:
    - id: default
      mode: tag-follow

notify:
  - type: ntfy
    url: https://ntfy.sh/${NTFY_TOPIC}
    events: [update.available, update.success, update.failure]
