# yaml-language-server: $schema=https://raw.githubusercontent.com/nicolaeser/dockpaum/main/dockpaum.schema.json

http:
  token: ${UPDATE_API_TOKEN}
  update_api: true

schedule:
  cron: "0 4 * * *"
  timezone: UTC

update:
  compose_group: true
  policies:
    - id: default
      mode: tag-follow
    - id: vendor
      mode: patch
      min_image_age: 1d
      health_timeout: 3m

notify:
  - type: slack
    url: ${SLACK_WEBHOOK_URL}
    events: [update.failure, run.completed]
